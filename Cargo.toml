[package]
name = "snout-auth"
description = "snout-auth: user sign-up, sign-in and sessions for Postgres-backed apps, with the users in the app's own database."
version = "0.1.8"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/snoutdata/snout-auth"
rust-version = "1.98.1"
publish = false

[[bin]]
name = "snout-auth"
path = "src/main.rs"

[dependencies]
# The server.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "form"] }
tower = { version = "0.5", default-features = false }
bytes = "1"
http-body-util = "0.1"

# Postgres: the project's own database, where the users are.
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-time-0_3"] }
deadpool-postgres = "0.14"

# Passwords, tokens and signatures.
bcrypt = "0.17"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
subtle = "2"
rand = "0.9"
base64 = "0.22"
hex = "0.4"
data-encoding = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# RSA and ECDSA signature checks (provider ID tokens, SAML) and the SAML key: the same crate
# the TLS stack is built on, so no second implementation of the primitives.
ring = "0.17"
x509-cert = { version = "0.2", default-features = false }
roxmltree = "0.20"
# The DEFLATE a SAML redirect carries its request in.
miniz_oxide = "0.8"

# Outbound: mail, and the identity providers a sign-in goes through.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
url = "2"
percent-encoding = "2"
regex = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi"] }


# Written out from the stack workspace by scripts/assemble.sh.
[lints.rust]
# X13: no `unsafe` outside the pgrx boundary. The three extensions under ext/ opt out in
# their own Cargo.toml when pgrx arrives, and nowhere else may.
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# For iterating on a build host: release speed without fat LTO's link time. Numbers that are
# reported (sizes, the bench) come from `release`, never from this.
[profile.fast]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true

# Its own workspace: this repository is not part of any other.
[workspace]
